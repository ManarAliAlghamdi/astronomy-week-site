<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأسبوع الفلكي</title>
<meta name="theme-color" content="#0E1033">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1033; --deep:#171A45; --line:#2C3068; --star:#EDE8DA; --muted:#A3A5CB;
  --accretion:#FFB35C; --plasma:#9FD8F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 1rem)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--night);color:var(--star);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:1.0625rem;line-height:1.8;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--accretion);outline-offset:3px}
.display{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 1.25rem}

/* hero: the stations as a constellation */
.hero{padding:2.5rem 0 1.5rem;text-align:center}
.hero h1{margin:0;font-size:clamp(2.6rem,11vw,4.2rem);line-height:1.1;font-weight:700}
.hero p{margin:.6rem auto 0;color:var(--muted);max-width:28rem}
.sky{display:block;width:100%;height:auto;margin:1.25rem 0 .25rem;overflow:visible}
.sky .link{stroke:var(--star);stroke-opacity:.4;stroke-width:1.5;fill:none}
.sky a{cursor:pointer;text-decoration:none}
.sky .halo{fill:var(--accretion);opacity:.22}
.sky .core{fill:var(--star)}
.sky text{fill:var(--star);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:19px;font-weight:700}
.sky a:hover .halo,.sky a:focus-visible .halo{opacity:.4}
.sky .bg{fill:var(--star)}
.hint{color:var(--muted);font-size:.9rem;margin:0}
@media (prefers-reduced-motion:no-preference){
  .sky .link{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease-out .3s forwards}
  .sky .star{opacity:0;animation:appear .5s ease-out forwards;animation-delay:var(--d)}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes appear{to{opacity:1}}
}

/* stations */
.station{padding:3rem 0 2.5rem;border-top:1px solid var(--line)}
.station:first-of-type{border-top:0}
.emblem{width:64px;height:64px;display:block;margin-bottom:1rem}
.station h2{margin:0;font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.25;font-weight:700}
.by{margin:.25rem 0 1rem;color:var(--muted);font-size:.95rem}
.station p.body{margin:0 0 1.25rem}
.photo{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 1.25rem}
.fact{margin:0 0 1.25rem;padding:.9rem 1.1rem;border-inline-start:3px solid var(--accretion);background:var(--deep);border-radius:0 8px 8px 0}
.fact strong{display:block;color:var(--accretion);font-weight:600;font-size:.95rem}
.cta{
  display:inline-flex;align-items:center;gap:.6rem;padding:.8rem 1.4rem;border-radius:999px;
  background:var(--accretion);color:#1B1030;font-weight:600;text-decoration:none;min-height:48px;
}
.cta:hover{filter:brightness(1.06)}
.top{display:inline-block;margin-top:1.5rem;color:var(--muted);font-size:.9rem}

/* starfield behind the whole page */
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* one topic at a time */
[hidden]{display:none!important}
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding-top:1.25rem;padding-bottom:.25rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{
  flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 1rem;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:.95rem;white-space:nowrap;
}
.tabs a[aria-current="page"]{background:var(--accretion);border-color:var(--accretion);color:#1B1030;font-weight:600}
.station{border-top:0;padding-top:1.5rem}

footer{padding:2rem 0 3rem;color:var(--muted);font-size:.9rem;text-align:center;border-top:1px solid var(--line)}
</style>
</head>
<body>

<script>
/* =====================================================================
   EDIT THE CONTENT HERE
   Each station needs: id (used in the link, English, no spaces), title,
   by (presenters), body, emblem (time | voyager | vr | blackhole).
   Optional: fact, image ("images/file.jpg"), link { label, href }.
   x, y place the star in the top constellation (0-360 across, 0-360 down).
   ===================================================================== */
const EVENT = {
  title: "الأسبوع الفلكي",
  intro: "اكتشفوا أركان معرضنا. اضغطوا على أي نجمة للانتقال إلى ركنها.",
  footer: "الأسبوع الفلكي"
};

const STATIONS = [
  {
    id: "time-travel", emblem: "time", x: 80, y: 80,
    title: "السفر عبر الزمن",
    by: "تولين",
    body: "هل يمكن أن يمر الزمن عند شخص أبطأ منه عند غيره؟ تقول النسبية الخاصة إنه كلما زادت سرعة الجسم تباطأ الزمن عنده، وتقول النسبية العامة إن الزمن يتباطأ أيضًا قرب الكتل الضخمة، وهنا يظهر دور الثقوب السوداء.",
    fact: "ساعات أقمار نظام GPS تتقدم نحو ٣٨ ميكروثانية كل يوم مقارنة بساعات الأرض، ولو لم يصحّحها العلماء لأخطأت الخرائط بعدة كيلومترات يوميًا."
  },
  {
    id: "voyager", emblem: "voyager", x: 260, y: 60,
    title: "مركبة فوياجر",
    by: "جوري وسارة وجود",
    body: "غادرت مركبة فوياجر الأرض عام ١٩٧٧ ولم تعد أبدًا. نعرض الصور التي التقطتها خلال رحلتها بين الكواكب، ونشرح كيف تصل معلوماتها إلينا من أبعد نقطة وصل إليها جسم صنعه الإنسان.",
    fact: "إشارة فوياجر ١ تحتاج اليوم نحو ٢٣ ساعة لتصل إلى الأرض، رغم أنها تسير بسرعة الضوء."
  },
  {
    id: "vr", emblem: "vr", x: 285, y: 220,
    title: "الفلك بالواقع الافتراضي",
    by: "فاطمة",
    body: "محطة تفاعلية تحوّل ما نتعلمه عن الفلك إلى تجربة تعيشها بنفسك. ارتدِ النظارة وتجوّل في الفضاء عن قرب."
  },
  {
    id: "black-holes", emblem: "blackhole", x: 125, y: 300,
    title: "الثقوب السوداء",
    by: "منار",
    body: "الثقب الأسود ليس فراغًا، بل كمية هائلة من المادة مضغوطة في مساحة صغيرة جدًا، جاذبيتها قوية لدرجة أن الضوء نفسه لا يستطيع الهروب منها. نشرح كيف تتكون، ونعرض أول صورة حقيقية التُقطت لثقب أسود.",
    fact: "لو ضُغطت الأرض لتصبح ثقبًا أسود، لكان حجمها بحجم حبة عنب فقط.",
    link: { label: "استمع لأصوات الفضاء", href: "sounds/" }
  }
];
</script>

<header class="hero wrap">
  <h1 class="display" id="eventTitle"></h1>
  <p id="eventIntro"></p>
  <svg class="sky" id="sky" viewBox="0 0 360 360" role="navigation" aria-label="أركان المعرض"></svg>
</header>

<nav class="tabs wrap" id="tabs" aria-label="الأركان" hidden></nav>

<main class="wrap" id="stations"></main>

<footer class="wrap" id="footer"></footer>

<script>
(function(){
"use strict";
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => {
  const n = document.createElementNS(NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
};

document.getElementById("eventTitle").textContent = EVENT.title;
document.getElementById("eventIntro").textContent = EVENT.intro;
document.getElementById("footer").textContent = EVENT.footer;
document.title = EVENT.title;

/* ---- constellation ---- */
const sky = document.getElementById("sky");
// faint background stars (fixed seed so the sky looks the same every visit)
let seed = 7;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
for(let i = 0; i < 70; i++){
  el("circle", {class:"bg", cx:(rnd()*360).toFixed(1), cy:(rnd()*360).toFixed(1), r:(rnd()*1.1 + .3).toFixed(2), opacity:(rnd()*.5 + .15).toFixed(2)}, sky);
}
// lines join the stations in order, closing the shape
const pts = STATIONS.map(s => [s.x, s.y]);
if(pts.length > 1){
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ") + (pts.length > 2 ? " Z" : "");
  const path = el("path", {class:"link", d}, sky);
  const len = Math.ceil(path.getTotalLength ? path.getTotalLength() : 800);
  path.style.setProperty("--len", len);
}
STATIONS.forEach((s, i) => {
  const a = el("a", {href:"#" + s.id, class:"star"}, sky);
  a.style.setProperty("--d", (0.2 + i*0.25) + "s");
  el("title", {}, a).textContent = s.title;
  el("circle", {class:"halo", cx:s.x, cy:s.y, r:30}, a);
  el("circle", {class:"core", cx:s.x, cy:s.y, r:8}, a);
  // keep labels inside the frame: put them below stars near the top, above otherwise
  const below = s.y < 120;
  const t = el("text", {x:s.x, y:s.y + (below ? 46 : -38), "text-anchor":"middle"}, a);
  t.textContent = s.title;
  // nudge long labels back inside the sky so none get cut off at the screen edge
  try{
    const w = t.getComputedTextLength();
    const cx = Math.min(Math.max(s.x, w/2 + 6), 360 - w/2 - 6);
    t.setAttribute("x", cx);
  }catch(e){}
});

/* ---- emblems: small line drawings for each topic ---- */
const EMBLEMS = {
  time: '<circle cx="32" cy="32" r="16" fill="none" stroke="#EDE8DA" stroke-width="2"/><path d="M32 22v10l7 5" fill="none" stroke="#FFB35C" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="32" cy="32" rx="29" ry="10" fill="none" stroke="#9FD8F0" stroke-width="1.5" transform="rotate(-20 32 32)"/>',
  voyager: '<path d="M14 26a18 9 0 0 0 36 0z" fill="none" stroke="#EDE8DA" stroke-width="2"/><path d="M32 35v10M24 45h16" stroke="#EDE8DA" stroke-width="2" stroke-linecap="round"/><path d="M40 45l18 12" stroke="#9FD8F0" stroke-width="1.5" stroke-linecap="round"/><circle cx="32" cy="18" r="2.5" fill="#FFB35C"/>',
  vr: '<rect x="8" y="20" width="48" height="24" rx="10" fill="none" stroke="#EDE8DA" stroke-width="2"/><circle cx="22" cy="32" r="6" fill="none" stroke="#9FD8F0" stroke-width="2"/><circle cx="42" cy="32" r="6" fill="none" stroke="#9FD8F0" stroke-width="2"/><circle cx="50" cy="14" r="1.6" fill="#FFB35C"/><circle cx="12" cy="10" r="1.2" fill="#EDE8DA"/>',
  blackhole: '<ellipse cx="32" cy="34" rx="28" ry="8" fill="none" stroke="#FFB35C" stroke-width="2"/><circle cx="32" cy="32" r="12" fill="#000" stroke="#FFB35C" stroke-width="1.5"/><path d="M4 34a28 8 0 0 0 56 0" fill="none" stroke="#FFB35C" stroke-width="2"/>'
};

/* ---- stations ---- */
const main = document.getElementById("stations");
STATIONS.forEach(s => {
  const sec = document.createElement("section");
  sec.className = "station"; sec.id = s.id;
  sec.setAttribute("aria-labelledby", s.id + "-title");
  let html = "";
  if(EMBLEMS[s.emblem]) html += '<svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">' + EMBLEMS[s.emblem] + "</svg>";
  html += '<h2 class="display" id="' + s.id + '-title"></h2><p class="by"></p>';
  if(s.image) html += '<img class="photo" alt="">';
  html += '<p class="body"></p>';
  if(s.fact) html += '<p class="fact"><strong>هل تعلم؟</strong><span></span></p>';
  if(s.link) html += '<a class="cta"></a>';
  html += '<a class="top" href="#">العودة إلى الرئيسية</a>';
  sec.innerHTML = html;
  sec.querySelector("h2").textContent = s.title;
  sec.querySelector(".by").textContent = "يقدّمه: " + s.by;
  sec.querySelector(".body").textContent = s.body;
  if(s.image){ const img = sec.querySelector(".photo"); img.src = s.image; img.alt = s.title; img.loading = "lazy"; }
  if(s.fact) sec.querySelector(".fact span").textContent = s.fact;
  if(s.link){ const a = sec.querySelector(".cta"); a.href = s.link.href; a.textContent = s.link.label; }
  main.appendChild(sec);
});

/* ---- starfield: fixed full-screen canvas behind everything ---- */
(function(){
  const cv = document.createElement("canvas");
  cv.id = "starfield"; cv.setAttribute("aria-hidden", "true");
  document.body.prepend(cv);
  const ctx = cv.getContext("2d");
  if(!ctx) return;
  const still = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  let stars = [], w = 0, h = 0;
  function build(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let s = 11;
    const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const n = Math.round(Math.min(260, Math.max(90, w * h / 4500)));
    stars = [];
    for(let i = 0; i < n; i++){
      stars.push({x:r()*w, y:r()*h, r:r()*1.2 + .3, a:r()*.5 + .25, p:r()*6.28, v:r()*1.5 + .5,
                  c:r() < .12 ? "255,179,92" : r() < .2 ? "159,216,240" : "237,232,218"});
    }
  }
  function draw(t){
    ctx.clearRect(0, 0, w, h);
    for(const st of stars){
      const a = still ? st.a : st.a * (.7 + .3 * Math.sin(t / 1000 * st.v + st.p));
      ctx.fillStyle = "rgba(" + st.c + "," + a.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.2832); ctx.fill();
    }
    if(!still) requestAnimationFrame(draw);
  }
  build(); requestAnimationFrame(draw);
  window.addEventListener("resize", () => { build(); if(still) draw(0); });
})();

/* ---- tabs: show one topic at a time ---- */
const tabs = document.getElementById("tabs");
const hero = document.querySelector(".hero");
const home = document.createElement("a");
home.href = "#"; home.textContent = "الرئيسية";
tabs.appendChild(home);
STATIONS.forEach(s => {
  const a = document.createElement("a");
  a.href = "#" + s.id; a.dataset.id = s.id; a.textContent = s.title;
  tabs.appendChild(a);
});

function route(){
  let id = "";
  try{ id = decodeURIComponent(location.hash.slice(1)); }catch(e){}
  const known = STATIONS.some(s => s.id === id);
  if(!known) id = "";
  hero.hidden = !!id;
  tabs.hidden = !id;
  main.querySelectorAll(".station").forEach(sec => { sec.hidden = sec.id !== id; });
  tabs.querySelectorAll("a").forEach(a => {
    if(a.dataset.id === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const cur = tabs.querySelector('[aria-current="page"]');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({inline:"center", block:"nearest"});
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
