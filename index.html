<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسبوع الفلك</title>
<meta name="theme-color" content="#0E1033">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1033; --deep:#171A45; --line:#2C3068; --star:#EDE8DA; --muted:#A3A5CB;
  --accretion:#FFB35C; --plasma:#9FD8F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 1rem)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  display:flex;flex-direction:column;min-height:100vh;min-height:100svh;
  margin:0;background:var(--night);color:var(--star);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:1.0625rem;line-height:1.8;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--accretion);outline-offset:3px}
.display{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif}
.wrap{width:100%;max-width:680px;margin:0 auto;padding:0 1.25rem}
#sceneTop{flex:2 1 0;width:100%;min-height:0}
#scene{flex:3 1 0;width:100%;min-height:0}
/* home page fits the screen exactly: no scrolling */
html.home,html.home body{height:100vh;height:100svh;overflow:hidden}
html.home footer{display:none}

/* hero: the stations as a constellation */
.hero{padding:.5rem 1.25rem .5rem;text-align:center}
.hero h1{margin:0;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1.1;font-weight:700}
.hero p{margin:.6rem auto 0;color:var(--muted);max-width:28rem}
.sky{display:block;width:auto;max-width:100%;height:min(46vh,440px);height:min(46svh,440px);margin:.5rem auto 0;overflow:visible}
.sky .link{stroke:var(--star);stroke-opacity:.4;stroke-width:1.5;fill:none}
.sky a{cursor:pointer;text-decoration:none}
.sky .halo{fill:var(--accretion);opacity:.22}
.sky .core{fill:var(--star)}
.sky text{fill:var(--star);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:19px;font-weight:600}
.sky a:hover .halo,.sky a:focus-visible .halo{opacity:.4}
.sky .bg{fill:var(--star)}
.hint{color:var(--muted);font-size:.9rem;margin:0}
@media (prefers-reduced-motion:no-preference){
  .sky .link{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease-out .3s forwards}
  .sky .star{opacity:0;animation:appear .5s ease-out forwards;animation-delay:var(--d)}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes appear{to{opacity:1}}
}

/* stations */
.station{padding:3rem 0 2.5rem;border-top:1px solid var(--line)}
.station:first-of-type{border-top:0}
.emblem{width:64px;height:64px;display:block;margin-bottom:1rem}
.station h2{margin:0;font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.25;font-weight:700}
.by{margin:.25rem 0 1rem;color:var(--muted);font-size:.95rem}
.station p.body{margin:0 0 1.25rem}
.photo{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 1.25rem}
.fact{margin:0 0 1.25rem;padding:.9rem 1.1rem;border-inline-start:3px solid var(--accretion);background:var(--deep);border-radius:0 8px 8px 0}
.fact strong{display:block;color:var(--accretion);font-weight:600;font-size:.95rem}
.cta{
  display:inline-flex;align-items:center;gap:.6rem;padding:.8rem 1.4rem;border-radius:999px;
  background:var(--accretion);color:#1B1030;font-weight:600;text-decoration:none;min-height:48px;
}
.cta:hover{filter:brightness(1.06)}
.actions{display:flex;flex-wrap:wrap;gap:.7rem}
.cta.alt{background:transparent;color:var(--star);border:1.5px solid var(--accretion)}
.cta.alt:hover{background:var(--deep);filter:none}
.top{display:inline-block;margin-top:1.5rem;color:var(--muted);font-size:.9rem}

/* starfield behind the whole page */
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* one topic at a time */
[hidden]{display:none!important}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.4rem,2vw,.7rem);padding-top:1.25rem;padding-bottom:.25rem}
.tabs a{
  display:inline-flex;align-items:center;justify-content:center;text-align:center;
  min-height:40px;padding:0 clamp(.7rem,3vw,1rem);border-radius:999px;
  border:1px solid var(--line);color:var(--muted);text-decoration:none;
  font-size:clamp(.82rem,3.3vw,.95rem);line-height:1.3;
}
.tabs a[aria-current="page"]{background:var(--accretion);border-color:var(--accretion);color:#1B1030;font-weight:600}
.station{border-top:0;padding-top:1.5rem}

footer{padding:2rem 0 3rem;color:var(--muted);font-size:.9rem;text-align:center;border-top:1px solid var(--line)}
</style>
</head>
<body>

<script>
/* =====================================================================
   EDIT THE CONTENT HERE
   Each station needs: id (used in the link, English, no spaces), title,
   by (presenters), body, emblem (time | voyager | vr | blackhole).
   Optional: fact, image ("images/file.jpg"), link { label, href },
   or links [{ label, href }, ...] for several buttons (first is filled, rest outlined).
   page: "folder/" makes the star and tab open that separate page instead of a section here
   (then only id, title, x, y are needed).
   x, y place the star in the top constellation (0-360 across, 0-420 down).
   ===================================================================== */
const EVENT = {
  title: "أسبوع الفلك",
  intro: "اكتشفوا أركان معرضنا. اضغطوا على أي نجمة للانتقال إلى ركنها.",
  footer: "أسبوع الفلك"
};

const STATIONS = [
  {
    id: "time-travel", page: "time-travel/", x: 85, y: 50,
    title: "السفر عبر الزمن"
  },
  {
    id: "voyager", page: "voyager/", x: 272, y: 120,
    title: "مركبة فوياجر"
  },
  {
    id: "vr", emblem: "vr", x: 90, y: 200,
    title: "الفلك بالواقع الافتراضي",
    by: "فاطمة",
    body: "محطة تفاعلية تحوّل ما نتعلمه عن الفلك إلى تجربة تعيشها بنفسك. ارتدِ النظارة وتجوّل في الفضاء عن قرب."
  },
  {
    id: "black-holes", page: "black-holes/", x: 265, y: 275,
    title: "الثقوب السوداء"
  },
  {
    id: "sounds", page: "sounds/", x: 110, y: 355,
    title: "أصوات الفضاء"
  }
];
</script>

<div id="sceneTop" aria-hidden="true"></div>

<header class="hero wrap">
  <h1 class="display" id="eventTitle"></h1>
  <p id="eventIntro"></p>
  <svg class="sky" id="sky" viewBox="0 0 360 420" role="navigation" aria-label="أركان المعرض"></svg>
</header>

<div id="scene" aria-hidden="true"></div>

<nav class="tabs wrap" id="tabs" aria-label="الأركان" hidden></nav>

<main class="wrap" id="stations"></main>

<footer class="wrap" id="footer"></footer>

<script>
(function(){
"use strict";
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => {
  const n = document.createElementNS(NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
};

document.getElementById("eventTitle").textContent = EVENT.title;
document.getElementById("eventIntro").textContent = EVENT.intro;
document.getElementById("footer").textContent = EVENT.footer;
document.title = EVENT.title;

/* ---- constellation ---- */
const sky = document.getElementById("sky");
// faint background stars (fixed seed so the sky looks the same every visit)
let seed = 7;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
for(let i = 0; i < 70; i++){
  el("circle", {class:"bg", cx:(rnd()*420).toFixed(1), cy:(rnd()*360).toFixed(1), r:(rnd()*1.1 + .3).toFixed(2), opacity:(rnd()*.5 + .15).toFixed(2)}, sky);
}
// lines join the stations in order, closing the shape
const pts = STATIONS.map(s => [s.x, s.y]);
if(pts.length > 1){
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ") + (pts.length > 2 ? " Z" : "");
  const path = el("path", {class:"link", d}, sky);
  const len = Math.ceil(path.getTotalLength ? path.getTotalLength() : 800);
  path.style.setProperty("--len", len);
}
STATIONS.forEach((s, i) => {
  const a = el("a", {href:s.page || "#" + s.id, class:"star"}, sky);
  a.style.setProperty("--d", (0.2 + i*0.25) + "s");
  el("title", {}, a).textContent = s.title;
  el("circle", {class:"halo", cx:s.x, cy:s.y, r:22}, a);
  el("circle", {class:"core", cx:s.x, cy:s.y, r:7}, a);
  // keep labels inside the frame: put them below stars near the top, above otherwise
  const below = s.y < 100;
  const t = el("text", {x:s.x, y:s.y + (below ? 38 : -30), "text-anchor":"middle"}, a);
  t.textContent = s.title;
  // nudge long labels back inside the sky so none get cut off at the screen edge
  try{
    const w = t.getComputedTextLength();
    const cx = Math.min(Math.max(s.x, w/2 + 6), 360 - w/2 - 6);
    t.setAttribute("x", cx);
  }catch(e){}
});

/* ---- emblems: small line drawings for each topic ---- */
const EMBLEMS = {
  time: '<circle cx="32" cy="32" r="16" fill="none" stroke="#EDE8DA" stroke-width="2"/><path d="M32 22v10l7 5" fill="none" stroke="#FFB35C" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="32" cy="32" rx="29" ry="10" fill="none" stroke="#9FD8F0" stroke-width="1.5" transform="rotate(-20 32 32)"/>',
  voyager: '<path d="M14 26a18 9 0 0 0 36 0z" fill="none" stroke="#EDE8DA" stroke-width="2"/><path d="M32 35v10M24 45h16" stroke="#EDE8DA" stroke-width="2" stroke-linecap="round"/><path d="M40 45l18 12" stroke="#9FD8F0" stroke-width="1.5" stroke-linecap="round"/><circle cx="32" cy="18" r="2.5" fill="#FFB35C"/>',
  vr: '<rect x="8" y="20" width="48" height="24" rx="10" fill="none" stroke="#EDE8DA" stroke-width="2"/><circle cx="22" cy="32" r="6" fill="none" stroke="#9FD8F0" stroke-width="2"/><circle cx="42" cy="32" r="6" fill="none" stroke="#9FD8F0" stroke-width="2"/><circle cx="50" cy="14" r="1.6" fill="#FFB35C"/><circle cx="12" cy="10" r="1.2" fill="#EDE8DA"/>',
  blackhole: '<ellipse cx="32" cy="34" rx="28" ry="8" fill="none" stroke="#FFB35C" stroke-width="2"/><circle cx="32" cy="32" r="12" fill="#000" stroke="#FFB35C" stroke-width="1.5"/><path d="M4 34a28 8 0 0 0 56 0" fill="none" stroke="#FFB35C" stroke-width="2"/>'
};

/* ---- stations ---- */
const main = document.getElementById("stations");
STATIONS.filter(s => !s.page).forEach(s => {
  const sec = document.createElement("section");
  sec.className = "station"; sec.id = s.id;
  sec.setAttribute("aria-labelledby", s.id + "-title");
  let html = "";
  if(EMBLEMS[s.emblem]) html += '<svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">' + EMBLEMS[s.emblem] + "</svg>";
  html += '<h2 class="display" id="' + s.id + '-title"></h2><p class="by"></p>';
  if(s.image) html += '<img class="photo" alt="">';
  html += '<p class="body"></p>';
  if(s.fact) html += '<p class="fact"><strong>هل تعلم؟</strong><span></span></p>';
  const btns = s.links || (s.link ? [s.link] : []);
  if(btns.length) html += '<div class="actions">' + btns.map(() => '<a class="cta"></a>').join("") + '</div>';
  html += '<a class="top" href="#">العودة إلى الرئيسية</a>';
  sec.innerHTML = html;
  sec.querySelector("h2").textContent = s.title;
  sec.querySelector(".by").textContent = "يقدّمه: " + s.by;
  sec.querySelector(".body").textContent = s.body;
  if(s.image){ const img = sec.querySelector(".photo"); img.src = s.image; img.alt = s.title; img.loading = "lazy"; }
  if(s.fact) sec.querySelector(".fact span").textContent = s.fact;
  sec.querySelectorAll(".cta").forEach((a, i) => {
    a.href = btns[i].href; a.textContent = btns[i].label;
    if(i) a.classList.add("alt");
  });
  main.appendChild(sec);
});

/* ---- starfield (whole page) + space scene (only in the #scene zone of the home page) ---- */
(function(){
  const cv = document.createElement("canvas");
  cv.id = "starfield"; cv.setAttribute("aria-hidden", "true");
  document.body.prepend(cv);
  const ctx = cv.getContext("2d");
  if(!ctx) return;
  const still = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const heroEl = document.querySelector(".hero"), zones = [{el:document.getElementById("sceneTop"), kind:"top"}, {el:document.getElementById("scene"), kind:"bottom"}].map(z => Object.assign(z, {things:[], nextComet:1, nextSat:5, nextProbe:9, seeded:false}));
  let stars = [], w = 0, h = 0, zw = 0, zh = 0;
  let bits = [], cz = null, fade = 0, last = 0;
  const rand = (a, b) => a + Math.random() * (b - a);
  for(let i = 0; i < 46; i++) bits.push({a:Math.random()*6.28, d:rand(1.3, 4.2), s:rand(.7, 1.3)});

  function build(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let s = 11;
    const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const n = Math.round(Math.min(260, Math.max(90, w * h / 4500)));
    stars = [];
    for(let i = 0; i < n; i++){
      stars.push({x:r()*w, y:r()*h, r:r()*1.2 + .3, a:r()*.5 + .25, p:r()*6.28, v:r()*1.5 + .5,
                  c:r() < .12 ? "255,179,92" : r() < .2 ? "159,216,240" : "237,232,218"});
    }
  }

  function drawStars(t){
    for(const st of stars){
      const a = still ? st.a : st.a * (.7 + .3 * Math.sin(t / 1000 * st.v + st.p));
      ctx.fillStyle = "rgba(" + st.c + "," + a.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.2832); ctx.fill();
    }
  }

  function ball(x, y, r, c1, c2){
    const g = ctx.createRadialGradient(x - r * .4, y - r * .4, r * .1, x, y, r);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  function shade(x, y, r){
    const g = ctx.createRadialGradient(x - r * .5, y - r * .5, r * .6, x, y, r * 1.05);
    g.addColorStop(0, "rgba(14,16,51,0)"); g.addColorStop(1, "rgba(14,16,51,.65)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }

  // all scene coordinates are local to the zone: (0,0) top-left, zw x zh
  function drawPlanets(t, kind){
    const T = kind === "top", u = Math.min(zw * .5, zh) * (T ? 1.6 : 1), tt = still ? 0 : t / 1000;
    let r, x, y;
    if(T){ // Saturn
    r = u * .1; x = zw * .2; y = zh * .5 + Math.sin(tt * .5) * 4;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-.35);
    ctx.strokeStyle = "rgba(237,232,218,.55)"; ctx.lineWidth = r * .22;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * .55, 0, Math.PI, 6.2832); ctx.stroke();
    ball(0, 0, r, "#F4D9A0", "#B98A4A"); shade(0, 0, r);
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * .55, 0, 0, Math.PI); ctx.stroke();
    ctx.restore(); }
    if(!T){ // Jupiter
    r = u * .12; x = zw * .3; y = zh * .3 + Math.sin(tt * .4 + 2) * 5;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.clip();
    ball(x, y, r, "#F0CFA4", "#B97B4E");
    ["rgba(150,90,60,.45)", "rgba(240,225,200,.35)", "rgba(150,90,60,.5)", "rgba(240,225,200,.3)"].forEach((c, i) => {
      ctx.fillStyle = c; ctx.fillRect(x - r, y - r * .6 + i * r * .35, r * 2, r * .17);
    });
    ctx.fillStyle = "rgba(190,80,60,.7)"; ctx.beginPath(); ctx.ellipse(x - r * .2, y + r * .3, r * .22, r * .12, 0, 0, 6.2832); ctx.fill();
    shade(x, y, r); ctx.restore(); }
    if(T){ // Earth + moon
    r = u * .07; x = zw * .8; y = zh * .5 + Math.sin(tt * .45 + 4) * 4;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.clip();
    ball(x, y, r, "#7FC4F2", "#1E5FA8");
    ctx.fillStyle = "rgba(90,170,100,.85)";
    ctx.beginPath(); ctx.ellipse(x - r * .3, y - r * .2, r * .35, r * .22, .5, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r * .35, y + r * .35, r * .3, r * .18, -.4, 0, 6.2832); ctx.fill();
    shade(x, y, r); ctx.restore();
    const ma = tt * .6, mx = x + Math.cos(ma) * r * 2.2, my = y + Math.sin(ma) * r * .7;
    ctx.strokeStyle = "rgba(237,232,218,.15)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(x, y, r * 2.2, r * .7, 0, 0, 6.2832); ctx.stroke();
    ball(mx, my, r * .22, "#EDE8DA", "#9A98A8"); }
    if(!T){ // Mars
    r = u * .04; x = zw * .5; y = zh * .8 + Math.sin(tt * .6 + 1) * 3;
    ball(x, y, r, "#F08C5C", "#A83A1E"); shade(x, y, r); }
  }

  function drawBlackHole(dt){
    const r = u0() * .07, x = zw * .8, y = zh * .62, tilt = .3;
    const g = ctx.createRadialGradient(x, y, r * .8, x, y, r * 5);
    g.addColorStop(0, "rgba(255,179,92,.28)"); g.addColorStop(1, "rgba(255,179,92,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 5, 0, 6.2832); ctx.fill();
    for(const b of bits){
      b.a += dt * 1.6 * b.s / Math.pow(b.d, 1.5);
      b.d -= dt * .12 * b.s;
      if(b.d < 1.1){ b.d = rand(3.6, 4.4); b.a = Math.random() * 6.28; }
    }
    const put = (b) => {
      const heat = Math.min(1, (4.4 - b.d) / 3);
      ctx.fillStyle = "rgba(255," + Math.round(210 - 90 * heat) + "," + Math.round(140 - 70 * heat) + "," + (.35 + .5 * heat).toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(x + Math.cos(b.a) * b.d * r, y + Math.sin(b.a) * b.d * r * tilt, 1.2 + heat, 0, 6.2832); ctx.fill();
    };
    bits.forEach(b => { if(Math.sin(b.a) < 0) put(b); });
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "rgba(255,179,92,.8)"; ctx.lineWidth = 1.5; ctx.stroke();
    bits.forEach(b => { if(Math.sin(b.a) >= 0) put(b); });
  }
  function u0(){ return Math.min(zw * .5, zh); }

  function spawn(kind){
    if(kind === "comet"){
      const s = rand(200, 320);
      cz.things.push({k:"comet", x:rand(zw * .3, zw + 60), y:-30, vx:-s * .8, vy:s * .6, len:rand(60, 110)});
    }else if(kind === "sat"){
      const left = Math.random() < .5;
      cz.things.push({k:"sat", x:left ? -30 : zw + 30, y:rand(zh * .1, zh * .45), vx:(left ? 1 : -1) * rand(35, 55), vy:rand(-4, 8), t:0});
    }else{
      cz.things.push({k:"probe", x:zw + 40, y:rand(zh * .45, zh * .65), vx:-rand(14, 22), vy:rand(-3, 3), t:0});
    }
  }

  function drawThing(o, dt){
    o.x += o.vx * dt; o.y += o.vy * dt; o.t = (o.t || 0) + dt;
    if(o.k === "comet"){
      const m = Math.hypot(o.vx, o.vy), tx = o.x - o.vx / m * o.len, ty = o.y - o.vy / m * o.len;
      const g = ctx.createLinearGradient(o.x, o.y, tx, ty);
      g.addColorStop(0, "rgba(159,216,240,.9)"); g.addColorStop(1, "rgba(159,216,240,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 2.5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = "#EDE8DA"; ctx.beginPath(); ctx.arc(o.x, o.y, 3, 0, 6.2832); ctx.fill();
      return o.y < zh + 50 && o.x > -150;
    }
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(Math.atan2(o.vy, o.vx));
    if(o.k === "sat"){
      ctx.fillStyle = "#EDE8DA"; ctx.fillRect(-5, -3, 10, 6);
      ctx.fillStyle = "#6FA8DC"; ctx.fillRect(-4, -13, 8, 8); ctx.fillRect(-4, 5, 8, 8);
      ctx.strokeStyle = "rgba(14,16,51,.6)"; ctx.lineWidth = .6; ctx.strokeRect(-4, -13, 8, 8); ctx.strokeRect(-4, 5, 8, 8);
      if(Math.sin(o.t * 5) > 0){ ctx.fillStyle = "#FF6B5C"; ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, 6.2832); ctx.fill(); }
    }else{
      ctx.strokeStyle = "#EDE8DA"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(-4, 0, 3.5, 8, 0, -1.57, 1.57, true); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.fillStyle = "#EDE8DA"; ctx.fillRect(2, -3, 5, 6);
      ctx.strokeStyle = "#FFB35C"; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(16, -5); ctx.stroke();
      for(let i = 0; i < 3; i++){
        const ph = (o.t * .9 + i / 3) % 1;
        ctx.strokeStyle = "rgba(159,216,240," + (1 - ph).toFixed(2) + ")"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(-6, 0, 8 + ph * 26, 2.5, 3.78); ctx.stroke();
      }
    }
    ctx.restore();
    return o.x > -80 && o.x < zw + 80 && o.y > -80 && o.y < zh + 80;
  }

  function frame(now){
    const t = now || 0, dt = Math.min(.05, last ? (t - last) / 1000 : 0);
    last = t;
    ctx.clearRect(0, 0, w, h);
    drawStars(t);
    const home = !heroEl.hidden;
    fade += ((home ? 1 : 0) - fade) * Math.min(1, dt * 4);
    if(still) fade = home ? 1 : 0;
    if(fade > .02){
      for(const z of zones){
        const rc = z.el.getBoundingClientRect();
        zw = rc.width; zh = rc.height; cz = z;
        if(zh < 40) continue;
        if(!z.seeded && !still){
          z.seeded = true; spawn("comet");
          if(z.kind === "top"){ spawn("sat"); z.things[1].x = zw * .5; }
        }
        ctx.save();
        ctx.beginPath(); ctx.rect(rc.left, rc.top, zw, zh); ctx.clip();   // nothing is drawn outside the zones
        ctx.translate(rc.left, rc.top);
        ctx.globalAlpha = fade;
        drawPlanets(t, z.kind);
        if(z.kind === "bottom") drawBlackHole(still ? 0 : dt);
        if(!still){
          if(home){
            z.nextComet -= dt; z.nextSat -= dt; z.nextProbe -= dt;
            if(z.nextComet < 0){ spawn("comet"); z.nextComet = z.kind === "top" ? rand(1.8, 4) : rand(4, 8); }
            if(z.kind === "top" && z.nextSat < 0){ spawn("sat"); z.nextSat = rand(12, 20); }
            if(z.kind === "bottom" && z.nextProbe < 0){ spawn("probe"); z.nextProbe = rand(25, 40); }
          }
          z.things = z.things.filter(o => drawThing(o, dt));
        }
        ctx.restore();
      }
    }else if(!home){ zones.forEach(z => { z.things = []; }); }
    if(!still) requestAnimationFrame(frame);
  }

  build(); requestAnimationFrame(frame);
  window.addEventListener("resize", () => { build(); if(still) requestAnimationFrame(frame); });
  window.addEventListener("hashchange", () => { if(still) requestAnimationFrame(frame); });
  window.addEventListener("scroll", () => { if(still) requestAnimationFrame(frame); }, {passive:true});
})();

/* ---- tabs: show one topic at a time ---- */
const tabs = document.getElementById("tabs");
const hero = document.querySelector(".hero");
const home = document.createElement("a");
home.href = "#"; home.textContent = "الرئيسية";
tabs.appendChild(home);
STATIONS.forEach(s => {
  const a = document.createElement("a");
  a.href = s.page || "#" + s.id; a.dataset.id = s.id; a.textContent = s.title;
  tabs.appendChild(a);
});

function route(){
  let id = "";
  try{ id = decodeURIComponent(location.hash.slice(1)); }catch(e){}
  const st = STATIONS.find(s => s.id === id);
  if(st && st.page){ location.replace(st.page); return; }   // old links like #black-holes
  const known = !!st;
  if(!known) id = "";
  hero.hidden = !!id;
  document.documentElement.classList.toggle("home", !id);
  document.getElementById("scene").hidden = !!id;
  document.getElementById("sceneTop").hidden = !!id;
  tabs.hidden = !id;
  main.querySelectorAll(".station").forEach(sec => { sec.hidden = sec.id !== id; });
  tabs.querySelectorAll("a").forEach(a => {
    if(a.dataset.id === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
})();
</script>
