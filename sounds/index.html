<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أصوات الفضاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0FA; --surface:#E2E5F5; --line:#C9CDE6; --text:#171A45; --muted:#555A88;
  --accent:#C4611A; --accent-ink:#FFF6EA; --cool:#2E7FA0; --danger:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1033; --surface:#171A45; --line:#2A2E63; --text:#EDE8DA; --muted:#9A9CC4;
    --accent:#FFB35C; --accent-ink:#1B1030; --cool:#9FD8F0; --danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1033; --surface:#171A45; --line:#2A2E63; --text:#EDE8DA; --muted:#9A9CC4;
  --accent:#FFB35C; --accent-ink:#1B1030; --cool:#9FD8F0; --danger:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:1.0625rem; line-height:1.7; min-height:100vh;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.display{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif}

.page{max-width:1240px;margin:0 auto;padding:clamp(1.25rem,3vw,2.5rem) clamp(1rem,4vw,3rem) 3rem}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;margin-bottom:clamp(1.5rem,4vw,3rem)}
header h1{margin:0;font-size:clamp(2.4rem,6vw,4.25rem);line-height:1.1;font-weight:700;letter-spacing:0}
header p{margin:.6rem 0 0;color:var(--muted);max-width:38rem}

.layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.45fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:start}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .stage{order:-1}
}

/* sound list */
.list{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.pick{
  width:100%;display:flex;gap:1rem;align-items:flex-start;text-align:start;
  background:none;border:0;padding:1.1rem .25rem;cursor:pointer;min-height:44px;
}
.pick:hover .pick-title{color:var(--accent)}
.orbit{flex:none;width:34px;height:34px;margin-top:.2rem;position:relative}
.orbit::before{content:"";position:absolute;inset:0;border:1.5px solid var(--line);border-radius:50%}
.orbit::after{
  content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--muted);
  top:-4px;left:calc(50% - 4px);transform-origin:4px 21px;
}
.row.active .orbit::before{border-color:var(--accent)}
.row.active .orbit::after{background:var(--accent)}
.row.active.playing .orbit::after{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pick-title{display:block;font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-size:1.3rem;line-height:1.4;font-weight:500;transition:color .15s}
.row.active .pick-title{color:var(--accent)}
.pick-desc{display:block;color:var(--muted);font-size:.95rem;margin-top:.15rem}
.empty{color:var(--muted);padding:1.5rem 0}

/* stage */
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem)}
.canvas-wrap{position:relative;width:100%;aspect-ratio:1/0.78;max-height:62vh}
canvas{display:block;width:100%;height:100%}
canvas.fade{animation:fadein .7s ease-out}
@keyframes fadein{from{opacity:0}}
.now{margin-top:.75rem}
.now h2{margin:0;font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.25;font-weight:700}
.now p{margin:.35rem 0 0;color:var(--muted);max-width:40rem;min-height:1.7em}
.controls{display:flex;align-items:center;gap:1rem;margin-top:1.25rem}
.play{
  flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;cursor:pointer;
}
.play:disabled{opacity:.35;cursor:default}
.play svg{width:26px;height:26px}
.seek{flex:1;accent-color:var(--accent);min-width:0;height:32px}
.time{flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;min-width:6.5rem;text-align:end}


.notice{margin-top:1rem;color:var(--muted);font-size:.95rem}
.notice.error{color:var(--danger)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .row.active.playing .orbit::after{animation:none}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <a href="../" style="display:inline-block;margin-bottom:.75rem;color:var(--muted);font-size:.95rem">العودة إلى أسبوع الفلك</a>
      <h1 class="display">أصوات الفضاء</h1>
      <p>الفضاء صامت، لكن العلماء حوّلوا بياناته إلى أصوات. اختر صوتًا واستمع إليه بالسماعة.</p>
    </div>
  </header>

  <main class="layout" id="layout">
    <section aria-label="قائمة الأصوات">
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden></p>
      <p class="notice" id="notice" role="status" hidden></p>
    </section>

    <section class="stage" aria-label="الصوت الحالي">
      <div class="canvas-wrap"><canvas id="sky" aria-hidden="true"></canvas></div>
      <div class="now">
        <h2 class="display" id="nowTitle">اختر صوتًا من القائمة</h2>
        <p id="nowDesc"></p>
      </div>
      <div class="controls">
        <button class="play" id="playBtn" disabled aria-label="تشغيل">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 5v14L5 12z"/></svg>
        </button>
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="موضع التشغيل" disabled>
        <span class="time" id="time">٠:٠٠ / ٠:٠٠</span>
      </div>
    </section>
  </main>
</div>

<script>
/* =====================================================================
   YOUR SOUNDS: edit this list to add, remove, or reorder sounds.
   src:   path to the audio file (MP3, M4A, WAV all work here)
   anim:  blackhole | pulsar | planet | waves | earth | star | comet | sun
   duration is optional (seconds), only used before the file loads.
   ===================================================================== */
const SOUNDS = [
  { title: "غناء الأرض", description: "موجات راديو في الفضاء المحيط بالأرض، يشبه صوتها زقزقة العصافير", anim: "earth", src: "sounds/earth-chorus.m4a" },
  { title: "أصوات زحل", description: "موجات راديو مرتبطة بالشفق القطبي على كوكب زحل، سجّلتها مركبة كاسيني.", anim: "planet", src: "sounds/saturn-radio.m4a" },
  { title: "صوت نجم", description: "رصد تلسكوب كبلر تغيّرات صغيرة في لمعان نجم بعيد، وحوّلها العلماء إلى صوت.", anim: "pulsar", src: "sounds/kepler-star.m4a" },
  { title: "المرور بجانب مذنّب", description: "صوت ارتطام الغبار والصخور الصغيرة بدرع مركبة ستاردست أثناء مرورها بجانب مذنّب تمبل ١", anim: "comet", src: "sounds/comet-tempel1.m4a" },
  { title: "ثقب بيرسيوس الأسود", description: "موجات صوتية حقيقية يطلقها ثقب أسود في عنقود بيرسيوس المجري، رفع العلماء نغمتها ٥٧ أوكتاف لنتمكن من سماعها.", anim: "blackhole", src: "sounds/perseus-black-hole.m4a" },
  { title: "برق المشتري", description: "موجات راديو صادرة من عواصف البرق على كوكب المشتري، التقطتها مركبة فوياجر.", anim: "waves", src: "sounds/jupiter-lightning.m4a" },
];

(function(){
"use strict";
const $ = id => document.getElementById(id);
const arNum = new Intl.NumberFormat("ar-SA",{useGrouping:false});
const fmt = s => {
  if(!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return arNum.format(m) + ":" + arNum.format(Math.floor(sec/10)) + arNum.format(sec%10);
};

const state = { sounds:[], currentId:null };
const audio = new Audio();
audio.preload = "auto";

/* ---------- audio graph for the visual ---------- */
let actx = null, analyser = null, levelBuf = null, freqBuf = null;
function ensureGraph(){
  if(location.protocol === "file:") return; // browsers mute analysed audio from local files; animations still run
  if(actx) { if(actx.state === "suspended") actx.resume(); return; }
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser); analyser.connect(actx.destination);
    levelBuf = new Uint8Array(analyser.fftSize);
    freqBuf = new Uint8Array(analyser.frequencyBinCount);
  }catch(e){ analyser = null; }
}

/* ---------- rendering the list ---------- */
const listEl = $("list"), emptyEl = $("empty");
function current(){ return state.sounds.find(s => s.id === state.currentId) || null; }

function renderList(){
  listEl.textContent = "";
  state.sounds.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "row";
    if(s.id === state.currentId){ li.classList.add("active"); if(!audio.paused) li.classList.add("playing"); }

    const pick = document.createElement("button");
    pick.className = "pick";
    pick.setAttribute("aria-pressed", String(s.id === state.currentId && !audio.paused));
    const orbit = document.createElement("span"); orbit.className = "orbit"; orbit.setAttribute("aria-hidden","true");
    const text = document.createElement("span");
    const t = document.createElement("span"); t.className = "pick-title"; t.textContent = s.title || "بدون اسم";
    text.appendChild(t);
    if(s.description){ const d = document.createElement("span"); d.className = "pick-desc"; d.textContent = s.description; text.appendChild(d); }
    pick.append(orbit, text);
    pick.addEventListener("click", () => choose(s.id));
    li.appendChild(pick);

    listEl.appendChild(li);
  });
  const none = state.sounds.length === 0;
  emptyEl.hidden = !none;
  if(none) emptyEl.textContent = "لا توجد أصوات بعد.";
}

/* ---------- now playing ---------- */
const playBtn = $("playBtn"), seek = $("seek"), timeEl = $("time");
const PLAY = '<path d="M17 5v14L5 12z"/>';
const PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
function renderNow(){
  const s = current();
  $("nowTitle").textContent = s ? (s.title || "بدون اسم") : "اختر صوتًا من القائمة";
  $("nowDesc").textContent = s ? (s.description || "") : "";
  playBtn.disabled = !s; seek.disabled = !s;
  $("playIcon").innerHTML = audio.paused ? PLAY : PAUSE;
  playBtn.setAttribute("aria-label", audio.paused ? "تشغيل" : "إيقاف مؤقت");
  updateTime();
}
function duration(){
  if(isFinite(audio.duration) && audio.duration > 0) return audio.duration;
  const s = current(); return s && s.duration ? s.duration : 0;
}
let seeking = false;
function updateTime(){
  const d = duration();
  if(!seeking) seek.value = d ? Math.round(audio.currentTime / d * 1000) : 0;
  timeEl.textContent = fmt(audio.currentTime) + " / " + fmt(d);
}
seek.addEventListener("input", () => { seeking = true; const d = duration(); timeEl.textContent = fmt(seek.value/1000*d) + " / " + fmt(d); });
seek.addEventListener("change", () => { const d = duration(); if(d) audio.currentTime = seek.value/1000*d; seeking = false; });

function choose(id){
  const s = state.sounds.find(x => x.id === id); if(!s) return;
  ensureGraph();
  if(id === state.currentId && audio.src){
    if(audio.paused) audio.play().catch(playFailed); else audio.pause();
    return;
  }
  state.currentId = id;
  audio.src = s.src;
  audio.currentTime = 0;
  audio.play().catch(playFailed);
  renderList(); renderNow();
}
function playFailed(){ note("تعذّر تشغيل هذا الصوت. جرّب ملفًا آخر.", true); renderList(); renderNow(); }
playBtn.addEventListener("click", () => { if(state.currentId) choose(state.currentId); });
["play","pause","ended"].forEach(ev => audio.addEventListener(ev, () => { renderList(); renderNow(); }));
audio.addEventListener("timeupdate", updateTime);
audio.addEventListener("loadedmetadata", updateTime);
audio.addEventListener("ended", () => { audio.currentTime = 0; updateTime(); });

/* ---------- notices ---------- */
const noticeEl = $("notice");
let noticeTimer = null;
function note(msg, isError){
  noticeEl.hidden = false; noticeEl.textContent = msg;
  noticeEl.classList.toggle("error", !!isError);
  clearTimeout(noticeTimer);
  if(!isError) noticeTimer = setTimeout(() => { noticeEl.hidden = true; }, 4000);
}

/* ---------- animations ---------- */
const canvas = $("sky"), g = canvas.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI*2;
let W = 0, H = 0, dpr = 1, stars = [];
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
let C = {};
function readColors(){ C = { accent:css("--accent"), cool:css("--cool"), text:css("--text"), aurora:"#7CF2B0" }; }
function resize(){
  const r = canvas.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  g.setTransform(dpr,0,0,dpr,0,0);
  stars = Array.from({length:Math.round(W*H/2600)}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.1+.2, a:Math.random()*.6+.15, tw:Math.random()*TAU}));
}

let level = 0, t = 0;
const bands = new Float32Array(32);
function sampleAudio(){
  if(!analyser || audio.paused){ level *= 0.94; for(let i=0;i<32;i++) bands[i] *= 0.92; return false; }
  analyser.getByteTimeDomainData(levelBuf);
  let sum = 0;
  for(let i = 0; i < levelBuf.length; i++){ const v = (levelBuf[i] - 128)/128; sum += v*v; }
  level += (Math.min(1, Math.sqrt(sum/levelBuf.length)*4) - level) * 0.18;
  analyser.getByteFrequencyData(freqBuf);
  for(let b = 0; b < 32; b++){
    const lo = Math.floor(Math.pow(300, b/32)), hi = Math.max(lo+1, Math.floor(Math.pow(300, (b+1)/32)));
    let m = 0; for(let i = lo; i < hi; i++) m = Math.max(m, freqBuf[i]);
    bands[b] += (m/255 - bands[b]) * 0.3;
  }
  return true;
}

const SCENES = {
  blackhole: {
    label: "ثقب أسود",
    init(){
      this.parts = Array.from({length:520}, () => ({ rr: 1.25 + Math.pow(Math.random(), 1.6)*1.9, a: Math.random()*TAU, s: .6 + Math.random()*.5, size: Math.random()*1.4 + .4, hot: Math.random() }));
    },
    draw(cx, cy, S){
      const R = S*0.16*(1 + level*0.08), tilt = 0.32;
      const parts = front => {
        for(const p of this.parts){
          const ang = p.a + t*p.s/Math.pow(p.rr, 1.5)*3, sn = Math.sin(ang);
          if(front ? sn < 0 : sn >= 0) continue;
          const rad = R*p.rr*(1 + level*0.12), heat = 1 - (p.rr - 1.25)/1.9;
          g.globalAlpha = Math.min(1, (.25 + heat*.6)*(.7 + level*.9));
          g.fillStyle = p.hot > .82 ? C.cool : C.accent;
          g.beginPath(); g.arc(cx + Math.cos(ang)*rad, cy + sn*rad*tilt, p.size*(1 + level*.8), 0, TAU); g.fill();
        }
      };
      parts(false);
      const glow = g.createRadialGradient(cx, cy, R*0.9, cx, cy, R*1.9);
      glow.addColorStop(0, C.accent); glow.addColorStop(1, "transparent");
      g.globalAlpha = .35 + level*.45; g.fillStyle = glow;
      g.beginPath(); g.arc(cx, cy, R*1.9, 0, TAU); g.fill();
      g.globalAlpha = .9; g.strokeStyle = C.accent; g.lineWidth = 1.5 + level*3;
      g.beginPath(); g.arc(cx, cy, R*1.04, 0, TAU); g.stroke();
      g.globalAlpha = 1; g.fillStyle = "#000";
      g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
      parts(true);
    }
  },

  pulsar: {
    label: "نجم نابض",
    draw(cx, cy, S){
      const ang = t*(reduced ? 1.5 : 5), L = S*0.62, w = 0.07 + level*0.05;
      for(let i = 0; i < 4; i++){
        const k = ((t*0.35 + i/4) % 1);
        g.globalAlpha = (1 - k)*(0.25 + level*0.5);
        g.strokeStyle = C.cool; g.lineWidth = 1.2;
        g.beginPath(); g.arc(cx, cy, S*0.05 + k*S*0.45, 0, TAU); g.stroke();
      }
      for(const side of [0, Math.PI]){
        const d = ang + side;
        const grad = g.createRadialGradient(cx, cy, 0, cx, cy, L);
        grad.addColorStop(0, C.accent); grad.addColorStop(1, "transparent");
        g.globalAlpha = 0.45 + level*0.55; g.fillStyle = grad;
        g.beginPath(); g.moveTo(cx, cy);
        g.lineTo(cx + Math.cos(d - w)*L, cy + Math.sin(d - w)*L);
        g.lineTo(cx + Math.cos(d + w)*L, cy + Math.sin(d + w)*L);
        g.closePath(); g.fill();
      }
      const r = S*0.035*(1 + level*0.7);
      const halo = g.createRadialGradient(cx, cy, 0, cx, cy, r*5);
      halo.addColorStop(0, C.cool); halo.addColorStop(1, "transparent");
      g.globalAlpha = 0.6; g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, r*5, 0, TAU); g.fill();
      g.globalAlpha = 1; g.fillStyle = "#FFFFFF"; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    }
  },

  planet: {
    label: "كوكب بحلقات",
    draw(cx, cy, S){
      const R = S*0.19, tilt = 0.26;
      g.translate(cx, cy); g.rotate(-0.35);
      const rings = back => {
        for(let i = 0; i < 16; i++){
          const rr = R*(1.35 + i*0.06);
          g.globalAlpha = (0.12 + ((i*37) % 11)/22) * (0.7 + bands[i*2 % 32]*0.9);
          g.strokeStyle = i % 5 === 3 ? C.accent : C.text;
          g.lineWidth = R*0.045;
          g.beginPath(); g.ellipse(0, 0, rr, rr*tilt, 0, back ? Math.PI : 0, back ? TAU : Math.PI); g.stroke();
        }
      };
      rings(true);
      const body = g.createRadialGradient(-R*0.35, -R*0.4, R*0.1, 0, 0, R);
      body.addColorStop(0, "#F6D9A4"); body.addColorStop(0.6, "#B97A3C"); body.addColorStop(1, "#2A1726");
      g.globalAlpha = 1; g.fillStyle = body; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
      g.save(); g.beginPath(); g.arc(0, 0, R, 0, TAU); g.clip();
      for(let i = -6; i <= 6; i++){
        const y = i*R/6.5 + Math.sin(t*0.6 + i)*R*0.02;
        g.globalAlpha = 0.07 + (i % 2 ? 0.05 : 0) + level*0.08;
        g.fillStyle = i % 3 ? "#FFFFFF" : "#5A3020";
        g.fillRect(-R, y, R*2, R*0.07);
      }
      g.restore();
      rings(false);
    }
  },

  waves: {
    label: "موجات البلازما",
    init(){ this.rip = []; this.acc = 0; },
    draw(cx, cy, S){
      this.acc += 0.02 + level*0.3;
      if(this.acc > 1){ this.acc = 0; this.rip.push({r:S*0.03, a:1}); }
      g.strokeStyle = C.cool; g.lineWidth = 1.5;
      this.rip = this.rip.filter(p => {
        p.r += S*0.004*(1 + level*2); p.a -= 0.007;
        g.globalAlpha = Math.max(0, p.a)*0.55;
        g.beginPath(); g.arc(cx, cy, p.r, 0, TAU); g.stroke();
        return p.a > 0;
      });
      const live = analyser && !audio.paused;
      g.globalAlpha = 0.95; g.strokeStyle = C.accent; g.lineWidth = 2;
      g.beginPath();
      const n = 160, amp = S*0.28;
      for(let i = 0; i <= n; i++){
        const x = i/n*W;
        const env = Math.sin(i/n*Math.PI);
        const v = live ? (levelBuf[Math.floor(i/n*(levelBuf.length - 1))] - 128)/128 * 2.2
                       : Math.sin(i*0.18 + t*4)*0.08;
        const y = cy + Math.max(-1, Math.min(1, v))*amp*env;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    }
  },

  earth: {
    label: "الأرض",
    draw(cx, cy, S){
      const R = S*0.16;
      g.setLineDash([4, 9]); g.lineDashOffset = -t*40;
      for(const k of [1.7, 2.4, 3.1, 3.8]){
        g.globalAlpha = 0.18 + level*0.35; g.strokeStyle = C.cool; g.lineWidth = 1.2;
        for(const sgn of [1, -1]){
          g.beginPath();
          for(let th = 0.25; th <= Math.PI - 0.25; th += 0.04){
            const r = k*R*Math.pow(Math.sin(th), 2);
            const x = cx + sgn*r*Math.sin(th), y = cy - r*Math.cos(th);
            th === 0.25 ? g.moveTo(x, y) : g.lineTo(x, y);
          }
          g.stroke();
        }
      }
      g.setLineDash([]);
      const body = g.createRadialGradient(cx - R*0.35, cy - R*0.35, R*0.1, cx, cy, R);
      body.addColorStop(0, "#8FD0F0"); body.addColorStop(0.55, "#2360A8"); body.addColorStop(1, "#0A1838");
      g.globalAlpha = 1; g.fillStyle = body; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
      g.save(); g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
      g.strokeStyle = "#FFFFFF"; g.lineWidth = 1;
      for(let i = 0; i < 6; i++){
        const ph = (i/6*Math.PI + t*0.25) % Math.PI;
        g.globalAlpha = 0.14;
        g.beginPath(); g.ellipse(cx, cy, Math.abs(Math.cos(ph))*R, R, 0, 0, TAU); g.stroke();
      }
      for(const lat of [-0.9, -0.45, 0, 0.45, 0.9]){
        g.globalAlpha = 0.12;
        const y = cy + R*Math.sin(lat), hw = R*Math.cos(lat);
        g.beginPath(); g.moveTo(cx - hw, y); g.lineTo(cx + hw, y); g.stroke();
      }
      g.restore();
      g.shadowColor = C.aurora; g.shadowBlur = 12 + level*30;
      g.strokeStyle = C.aurora; g.lineWidth = 3 + level*4;
      for(const sy of [-1, 1]){
        g.globalAlpha = 0.35 + level*0.6 + Math.sin(t*2 + sy)*0.08;
        g.beginPath(); g.ellipse(cx, cy + sy*R*0.9, R*0.42, R*0.11, 0, 0, TAU); g.stroke();
      }
      g.shadowBlur = 0;
    }
  },

  star: {
    label: "نجم",
    init(){ this.hist = []; },
    draw(cx, cy, S){
      const sy = cy - S*0.1;
      const b = 0.35 + level*0.9 + (reduced ? 0 : Math.sin(t*5)*0.03);
      // light curve: the star's brightness over time, like Kepler measures it
      this.hist.push(level);
      if(this.hist.length > 240) this.hist.shift();
      const base = cy + S*0.36, amp = S*0.12, x0 = W*0.12, x1 = W*0.88;
      g.globalAlpha = 0.25; g.strokeStyle = C.text; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x0, base); g.lineTo(x1, base); g.stroke();
      g.globalAlpha = 0.9; g.strokeStyle = C.cool; g.lineWidth = 2;
      g.beginPath();
      this.hist.forEach((v, i) => {
        const x = x1 - (this.hist.length - 1 - i)/239*(x1 - x0);
        const y = base - v*amp;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      });
      g.stroke();
      // glow
      const R = S*0.05;
      const halo = g.createRadialGradient(cx, sy, 0, cx, sy, R*6*(0.8 + level*0.6));
      halo.addColorStop(0, C.cool); halo.addColorStop(1, "transparent");
      g.globalAlpha = Math.min(1, 0.3 + b*0.5); g.fillStyle = halo;
      g.beginPath(); g.arc(cx, sy, R*6*(0.8 + level*0.6), 0, TAU); g.fill();
      // diffraction spikes
      const spike = (ang, len, wid) => {
        const grad = g.createLinearGradient(cx, sy, cx + Math.cos(ang)*len, sy + Math.sin(ang)*len);
        grad.addColorStop(0, "#FFFFFF"); grad.addColorStop(1, "transparent");
        g.fillStyle = grad;
        g.beginPath();
        g.moveTo(cx + Math.cos(ang + Math.PI/2)*wid, sy + Math.sin(ang + Math.PI/2)*wid);
        g.lineTo(cx + Math.cos(ang)*len, sy + Math.sin(ang)*len);
        g.lineTo(cx + Math.cos(ang - Math.PI/2)*wid, sy + Math.sin(ang - Math.PI/2)*wid);
        g.closePath(); g.fill();
      };
      g.globalAlpha = Math.min(1, 0.5 + b*0.5);
      for(let i = 0; i < 4; i++) spike(i*Math.PI/2, S*0.3*(0.6 + b*0.5), R*0.35);
      g.globalAlpha = Math.min(1, 0.25 + b*0.4);
      for(let i = 0; i < 4; i++) spike(Math.PI/4 + i*Math.PI/2, S*0.14*(0.6 + b*0.5), R*0.25);
      // core
      g.globalAlpha = 1; g.fillStyle = "#FFFFFF";
      g.beginPath(); g.arc(cx, sy, R*(0.55 + level*0.35), 0, TAU); g.fill();
    }
  },

  comet: {
    label: "مذنّب",
    init(){ this.p = []; this.sparks = []; this.prev = 0; },
    draw(cx, cy, S){
      const hx = cx - S*0.28, hy = cy + S*0.14;
      const dir = -0.42;                       // tail points up and away from the sun
      const dx = Math.cos(dir), dy = Math.sin(dir);
      const nx = -dy, ny = dx;
      // spawn tail particles
      const n = reduced ? 2 : 6 + Math.round(level*14);
      for(let i = 0; i < n; i++){
        const ion = Math.random() < 0.35;
        const sp = S*(ion ? 0.009 : 0.005)*(0.6 + Math.random()*0.8)*(1 + level);
        const spread = (Math.random() - 0.5)*(ion ? 0.08 : 0.35);
        this.p.push({x:hx, y:hy, vx:(dx + nx*spread)*sp, vy:(dy + ny*spread)*sp, curve: ion ? 0 : S*0.000009, a:1, ion, r:Math.random()*1.4 + 0.5});
      }
      this.p = this.p.filter(q => {
        q.vx += nx*q.curve*S*0.01; q.vy += ny*q.curve*S*0.01;
        q.x += q.vx; q.y += q.vy; q.a -= q.ion ? 0.009 : 0.007;
        if(q.a <= 0) return false;
        g.globalAlpha = q.a*(q.ion ? 0.7 : 0.55);
        g.fillStyle = q.ion ? C.cool : C.accent;
        g.beginPath(); g.arc(q.x, q.y, q.r*(q.ion ? 0.8 : 1), 0, TAU); g.fill();
        return true;
      });
      // dust hits: sparks when the sound jumps
      if(level - this.prev > 0.04 || (level > 0.35 && Math.random() < level*0.25)){
        for(let i = 0; i < 10; i++){
          const a = Math.random()*TAU, v = S*0.004*(0.5 + Math.random());
          this.sparks.push({x:hx, y:hy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, a:1});
        }
      }
      this.prev = level;
      g.fillStyle = "#FFFFFF";
      this.sparks = this.sparks.filter(k => {
        k.x += k.vx; k.y += k.vy; k.a -= 0.04;
        if(k.a <= 0) return false;
        g.globalAlpha = k.a; g.beginPath(); g.arc(k.x, k.y, 1.4, 0, TAU); g.fill();
        return true;
      });
      // coma and nucleus
      const R = S*0.03;
      const coma = g.createRadialGradient(hx, hy, 0, hx, hy, R*5*(1 + level*0.5));
      coma.addColorStop(0, C.cool); coma.addColorStop(1, "transparent");
      g.globalAlpha = 0.55 + level*0.4; g.fillStyle = coma;
      g.beginPath(); g.arc(hx, hy, R*5*(1 + level*0.5), 0, TAU); g.fill();
      g.globalAlpha = 1; g.fillStyle = "#F4F1FF";
      g.beginPath(); g.arc(hx, hy, R*0.6*(1 + level*0.3), 0, TAU); g.fill();
    }
  },

  sun: {
    label: "الشمس",
    draw(cx, cy, S){
      const R = S*0.15*(1 + level*0.05);
      const corona = g.createRadialGradient(cx, cy, R, cx, cy, R*2.6);
      corona.addColorStop(0, C.accent); corona.addColorStop(1, "transparent");
      g.globalAlpha = 0.35 + level*0.4; g.fillStyle = corona;
      g.beginPath(); g.arc(cx, cy, R*2.6, 0, TAU); g.fill();
      g.strokeStyle = C.accent; g.lineCap = "round";
      for(let i = 0; i < 72; i++){
        const a = i/72*TAU + t*0.08;
        const len = R*(0.18 + bands[i % 32]*1.3 + 0.1*Math.sin(t*2 + i*1.7));
        g.globalAlpha = 0.35 + bands[i % 32]*0.5; g.lineWidth = 2;
        g.beginPath();
        g.moveTo(cx + Math.cos(a)*R*1.02, cy + Math.sin(a)*R*1.02);
        g.lineTo(cx + Math.cos(a)*(R + len), cy + Math.sin(a)*(R + len));
        g.stroke();
      }
      const disk = g.createRadialGradient(cx - R*0.2, cy - R*0.2, R*0.1, cx, cy, R);
      disk.addColorStop(0, "#FFF6DC"); disk.addColorStop(0.55, "#FFC061"); disk.addColorStop(1, "#E0602A");
      g.globalAlpha = 1; g.fillStyle = disk; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
    }
  }
};
const SCENE_KEYS = Object.keys(SCENES);
function sceneKey(){
  const s = current();
  return s && SCENES[s.anim] ? s.anim : "blackhole";
}
let lastKey = null;
function draw(){
  sampleAudio();
  t += reduced ? 0.002 : 0.008 + level*0.03;
  g.clearRect(0, 0, W, H);
  for(const s of stars){
    g.globalAlpha = s.a*(reduced ? 1 : .75 + .25*Math.sin(t*3 + s.tw));
    g.fillStyle = C.text; g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.fill();
  }
  const key = sceneKey();
  if(key !== lastKey){
    lastKey = key;
    if(!reduced){ canvas.classList.remove("fade"); void canvas.offsetWidth; canvas.classList.add("fade"); }
  }
  g.save();
  SCENES[key].draw(W/2, H/2, Math.min(W, H));
  g.restore();
  requestAnimationFrame(draw);
}
readColors(); resize();
SCENE_KEYS.forEach(k => SCENES[k].init && SCENES[k].init());
new ResizeObserver(resize).observe(canvas);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
requestAnimationFrame(draw);

state.sounds = SOUNDS.map((x, i) => Object.assign({id:"s" + i}, x));
renderList(); renderNow();
})();
</script>
</body>
